<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- White Rounded Squircle Background -->
  <rect x="14" y="14" width="172" height="172" rx="46" fill="white" filter="url(#logoShadow)" />

  <!-- Handshake Emblem (Official Isyaratin Mark) -->
  <g stroke="#156669" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Horizontal Line & Right Wrist -->
    <path d="M68 62 H92 C104 58 118 61 133 59 L137 102" />

    <!-- Left Wrist & Diagonal Back of Hand -->
    <path d="M68 62 L64 101 L93 126" />

    <!-- Thumb Clasping Down & Around -->
    <path d="M92 62 C82 72 78 83 82 91 C85 97 93 98 98 92 C104 84 114 84 128 98" />

    <!-- 3 Clasping Finger Knuckles -->
    <path d="M93 126 C100 132 108 128 110 120 C114 125 122 122 125 113 C128 117 136 112 136 102" />
  </g>
</svg>
